spring:
  application:
    name: continuum-control

  spring:
    application:
      name: continuum-control

    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/continuum}
      username: ${DB_USER:continuum}
      password: ${DB_PASSWORD:senha-postgres-exemplo}

    jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false

  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/continuum}

  cache:
    type: redis
    redis:
      time-to-live: 60s

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,info

continuum:
  senha-inicial: ${CONTINUUM_SENHA_INICIAL:continuum123}