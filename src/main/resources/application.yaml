spring:
  application:
    name: continuum-control

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/continuum}
    username: ${DB_USER:continuum}
    password: ${DB_PASSWORD:evanescence}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info